<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="1024"
  height="1024"
  viewBox="0 0 1024 1024"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="XiOPC geometric curved X logo">

  <defs>
    <linearGradient
      id="xiopcGreen"
      x1="256"
      y1="256"
      x2="768"
      y2="768"
      gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="50%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <filter
      id="softShadow"
      x="-20%"
      y="-20%"
      width="140%"
      height="140%"
      color-interpolation-filters="sRGB">
      <feDropShadow
        dx="0"
        dy="14"
        stdDeviation="18"
        flood-color="#052E16"
        flood-opacity="0.14"/>
    </filter>
  </defs>

  <!--
    Fixed invisible square endpoints:
    Top-left:      256,256
    Top-right:     768,256
    Bottom-left:   256,768
    Bottom-right:  768,768

    Stroke thickness: 64
    Curvatures have been moved closer toward each other.
  -->

  <g filter="url(#softShadow)">

    <!-- Left curve: fixed endpoints, inward face below center -->
    <path
      d="M256 256
         C340 350 468 472 492 592
         C510 682 350 738 256 768"
      stroke="url(#xiopcGreen)"
      stroke-width="64"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"/>

    <!-- Right curve: fixed endpoints, inward face above center -->
    <path
      d="M768 256
         C674 286 514 342 532 432
         C556 552 684 674 768 768"
      stroke="url(#xiopcGreen)"
      stroke-width="64"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"/>

  </g>

</svg>